---
- Система:
    - Homepage:
        icon: homepage.png
        href: http://home.localhost
        description: Главная страница навигации, виджетов и статусов homelab.
        server: homelab
        container: homelab-homepage
        siteMonitor: http://homepage:3000

    - Caddy:
        icon: caddy.png
        description: Единая HTTP-точка входа для локальной сети и Tailscale.
        server: homelab
        container: homelab-caddy

    - Grafana:
        icon: grafana.png
        description: Дашборды по хосту, контейнерам и compose-проектам.
        server: homelab
        container: homelab-grafana
        siteMonitor: http://grafana:3000

    - Prometheus:
        icon: prometheus.png
        description: Хранилище метрик для Grafana и диагностических запросов.
        server: homelab
        container: homelab-prometheus
        siteMonitor: http://prometheus:9090

    - node_exporter:
        icon: prometheus.png
        description: "Метрики Raspberry Pi: CPU, память, диски, сеть и температура."
        server: homelab
        container: homelab-node-exporter

    - cAdvisor:
        icon: cadvisor.png
        description: Метрики контейнеров Docker для Prometheus и Grafana.
        server: homelab
        container: homelab-cadvisor

    - Glances:
        icon: glances.png
        description: Live-виджет состояния Raspberry Pi на верхнем уровне Homepage.
        server: homelab
        container: homelab-glances

- Сервисы:
    - База знаний:
        icon: wikijs.png
        href: http://wiki.localhost
        description: Локальная документация, заметки, инструкции и домашние знания. Внешний сервис; Homepage дает только ссылку и проверку доступности.
        siteMonitor: http://wiki.localhost

    - Умный дом:
        icon: mdi-home-automation
        href: http://homeassistant.localhost
        description: Освещение, датчики, автоматизации и управление устройствами. Внешний сервис; Homepage дает только ссылку и проверку доступности.
        siteMonitor: http://homeassistant.localhost

- Обслуживание:
    - Homelab Overview:
        icon: grafana.png
        href: http://grafana.localhost/d/homelab-overview/homelab-overview?orgId=1
        description: Общий обзор Raspberry Pi, контейнеров и мониторингового стека.

    - Compose Projects:
        icon: docker.png
        href: http://grafana.localhost/d/homelab-overview/homelab-overview?orgId=1&viewPanel=6
        description: Прямая ссылка на состояние compose-проектов.

    - PromQL:
        icon: prometheus.png
        href: http://prometheus.localhost
        description: Сырые метрики и PromQL для диагностики.

    - Portainer:
        icon: portainer.png
        href: http://portainer.localhost
        description: Опциональная Docker-админка, доступна только при запуске profile admin.
        server: homelab
        container: homelab-portainer
