---
- glances:
    url: http://glances:61208
    version: 4
    cpu: true
    memory: true
    cputemp: true
    uptime: true
    expanded: false
    refreshInterval: 5000

- datetime:
    text_size: xl
    locale: ru
    format:
        dateStyle: medium
        timeStyle: short

- search:
    provider: google
    placeholder: "Search the web..."
    target: _blank
