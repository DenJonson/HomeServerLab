global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: node_exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          instance: raspberrypi4

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          instance: raspberrypi4
  
  - job_name: connection-checker
    static_configs:
      - targets:
        - connection-checker:8080
    

  # Raspberry Pi temperature and compose project state are exported through
  # node_exporter's textfile collector by scripts/update-node-exporter-textfiles.sh.
